name: Build

# Fabrique les versions jouables à chaque envoi sur main : Windows, Linux, serveur dédié
# et Android (APK de test). Elles se téléchargent depuis la page de l'exécution, rubrique
# "Artifacts".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.1
  # Empreinte de ci/starwake-test.keystore : si la clé change, les mises à jour de l'APK
  # ne s'installent plus par-dessus l'ancienne version, donc la fabrication échoue.
  TEST_KEY_SHA256: 4febc97fc175c3f1d13214ab3c907a86299d08ee656f869216e1b76793a5c568

jobs:
  desktop:
    name: Windows, Linux et serveur
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Installer Godot et ses modèles d'export
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d "$RUNNER_TEMP/godot" && rm godot.zip
          sudo ln -s "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          unzip -q -j templates.tpz \
            templates/version.txt templates/icudt_godot.dat \
            templates/linux_release.x86_64 templates/linux_debug.x86_64 \
            templates/windows_release_x86_64.exe templates/windows_release_x86_64_console.exe \
            templates/windows_debug_x86_64.exe templates/windows_debug_x86_64_console.exe \
            -d "$dest"
          rm templates.tpz
          godot --version

      - name: Exporter
        run: |
          godot --headless --path . --import
          mkdir -p build/windows build/linux build/server
          godot --headless --path . --export-release "Windows" build/windows/Starwake.exe
          godot --headless --path . --export-release "Linux" build/linux/starwake.x86_64
          godot --headless --path . --export-release "Linux Server" build/server/starwake-server.x86_64
          ls -la build/*/
          test -s build/windows/Starwake.exe
          test -s build/linux/starwake.x86_64
          test -s build/server/starwake-server.x86_64

      - name: Vérifier que le serveur exporté démarre
        run: |
          ./build/server/starwake-server.x86_64 -- --port=24590 --quit-after=3 | tee server.log
          grep -q "listening port=24590" server.log

      - uses: actions/upload-artifact@v4
        with:
          name: starwake-windows
          path: build/windows/
      - uses: actions/upload-artifact@v4
        with:
          name: starwake-linux
          path: build/linux/
      - uses: actions/upload-artifact@v4
        with:
          name: starwake-serveur-linux
          path: build/server/

  android:
    name: Android (APK de test)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer Godot et le modèle Android
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d "$RUNNER_TEMP/godot" && rm godot.zip
          sudo ln -s "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          unzip -q -j templates.tpz \
            templates/version.txt templates/android_debug.apk templates/android_release.apk \
            -d "$dest"
          rm templates.tpz

      - name: Préparer la signature de test et les réglages de l'éditeur
        run: |
          # Clé de test fixe, rangée dans le dépôt : deux APK successifs portent la même
          # signature, donc le second s'installe par-dessus le premier. Elle est publique
          # et ne sert qu'aux APK de test ; la version du Play Store aura sa propre clé.
          keystore="$GITHUB_WORKSPACE/ci/starwake-test.keystore"
          test -s "$keystore"
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          ls "$sdk" "$sdk/build-tools" | head -40
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$sdk"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS
          sed -i 's/^          //' "$HOME/.config/godot/editor_settings-4.7.tres"
          cat "$HOME/.config/godot/editor_settings-4.7.tres"

      - name: Exporter l'APK
        run: |
          godot --headless --path . --import
          mkdir -p build/android
          godot --headless --path . --export-debug "Android" build/android/starwake.apk
          ls -la build/android/
          test -s build/android/starwake.apk

      - name: Vérifier que l'APK porte la signature fixe
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          apksigner="$(ls -d "$sdk"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$apksigner" verify --print-certs build/android/starwake.apk | tee signature.log
          grep -q "certificate SHA-256 digest: ${TEST_KEY_SHA256}$" signature.log

      - uses: actions/upload-artifact@v4
        with:
          name: starwake-android
          path: build/android/starwake.apk
